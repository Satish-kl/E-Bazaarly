# Bazaarly gateway.
# Docker's embedded DNS (127.0.0.11) + variables make nginx resolve upstreams at
# request time, so nginx still starts - and returns a clean 502 - if a service is down.
resolver 127.0.0.11 valid=10s ipv6=off;

log_format upstream_log '$remote_addr [$time_local] "$request" $status '
                        'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
access_log /var/log/nginx/access.log upstream_log;

server {
  listen 80;
  server_name _;

  set $frontend_upstream http://frontend:80;
  set $user_upstream     http://user-service:3001;
  set $product_upstream  http://product-service:3002;
  set $order_upstream    http://order-service:3003;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 3s;
  proxy_read_timeout    15s;

  # JSON error body when an upstream is down
  error_page 502 503 504 = @upstream_down;
  location @upstream_down {
    default_type application/json;
    return 502 '{"error":"upstream service unavailable"}';
  }

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # ---- API routing ----
  location /api/users/    { proxy_pass $user_upstream; }
  location /api/products  { proxy_pass $product_upstream; }
  location /api/orders    { proxy_pass $order_upstream; }

  # ---- Health endpoints for deployment verification ----
  location = /health/user    { proxy_pass $user_upstream/health; }
  location = /health/product { proxy_pass $product_upstream/health; }
  location = /health/order   { proxy_pass $order_upstream/health; }

  # /metrics is intentionally NOT proxied (internal only).

  # ---- React frontend ----
  location / { proxy_pass $frontend_upstream; }
}
